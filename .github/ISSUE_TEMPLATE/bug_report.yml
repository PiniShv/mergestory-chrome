name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: link-kind
    attributes:
      label: Where is the video?
      placeholder: YouTube, Google Drive, other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: See chrome://extensions.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142
    validations:
      required: true
